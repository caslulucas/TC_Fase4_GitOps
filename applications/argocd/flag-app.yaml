apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: flag
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/caslulucas/TC_Fase4_GitOps.git
    targetRevision: main
    path: apps/flag

  destination:
    server: https://kubernetes.default.svc
    namespace: flag

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true