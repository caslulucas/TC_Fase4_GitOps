apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: otel-agent
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.178.1

      helm:
        releaseName: otel-agent

        valueFiles:
          - $values/monitoring/otel-agent/values.yaml

    - repoURL: https://github.com/caslulucas/TC_Fase4_GitOps.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true