apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: grafana
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15

      helm:
        releaseName: grafana

        values: |
          service:
            type: ClusterIP

          persistence:
            enabled: false

          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
                  isDefault: true
                  editable: true

                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki.monitoring.svc.cluster.local:3100
                  isDefault: false
                  editable: true

          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  orgId: 1
                  folder: ""
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default

          dashboardsConfigMaps:
            default: togglemaster-grafana-dashboard

    - repoURL: https://github.com/caslulucas/TC_Fase4_GitOps.git
      targetRevision: main
      path: monitoring/grafana/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true