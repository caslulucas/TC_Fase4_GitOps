# =====================================================================
# PLATFORM APPLICATION
#
# Responsável pelos recursos compartilhados da plataforma:
# - Namespaces
# - Ingress
# - Configurações globais
# =====================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/caslulucas/TC_Fase4_GitOps.git
    targetRevision: main
    path: applications/platform

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:

    automated:
      prune: true
      selfHeal: true