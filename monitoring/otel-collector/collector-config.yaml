receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch: {}

exporters:
  debug:
    verbosity: basic

  otlphttp/loki:
    endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
  
  otlphttp/newrelic:
      endpoint: https://otlp.nr-data.net
      headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}

  prometheus:
    endpoint: 0.0.0.0:8889


connectors:
    span_metrics:
      histogram:
        explicit:
          buckets:
            - 5ms
            - 10ms
            - 25ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2.5s
            - 5s
      dimensions:
        - name: http.request.method
        - name: http.response.status_code

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:

  extensions:
    - health_check

  pipelines:

    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - debug
        - otlphttp/newrelic
        - span_metrics

      metrics/spanmetrics:
        receivers:
        - span_metrics
        processors:
        - batch
        exporters:
        - prometheus   

    metrics:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - debug

    logs:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - otlphttp/loki