receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch: {}

exporters:
  debug:
    verbosity: basic

  otlphttp/loki:
    endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
  

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:

  extensions:
    - health_check

  pipelines:

    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - debug

    metrics:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - debug

    logs:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - debug
        - otlphttp/loki