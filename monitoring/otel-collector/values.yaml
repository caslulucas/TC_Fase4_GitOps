mode: deployment

replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

    batch: {}

  exporters:
    debug:
      verbosity: basic

    otlphttp/loki:
      endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp

    otlphttp/newrelic:
      endpoint: https://otlp.nr-data.net
      headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}

    prometheus:
      endpoint: 0.0.0.0:8889      
    
  connectors:
    span_metrics:
      histogram:
        explicit:
          buckets:
            - 5ms
            - 10ms
            - 25ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2.5s
            - 5s
      dimensions:
        - name: http.request.method
        - name: http.response.status_code

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions:
      - health_check

    pipelines:

      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - otlphttp/newrelic
          - span_metrics

      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug

      metrics/spanmetrics:
        receivers:
          - span_metrics
        processors:
          - batch
        exporters:
          - prometheus


      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/loki
          

extraEnvs:
  - name: NEW_RELIC_LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: newrelic-otlp
        key: license-key

ports:
  otlp:
    enabled: true

  otlp-http:
    enabled: true

  jaeger-compact:
    enabled: false

  jaeger-thrift:
    enabled: false

  jaeger-grpc:
    enabled: false

  zipkin:
    enabled: false
  
  spanmetrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP