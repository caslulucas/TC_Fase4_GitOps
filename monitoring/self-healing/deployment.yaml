apiVersion: apps/v1
kind: Deployment

metadata:
  name: togglemaster-self-healing
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: togglemaster-self-healing

  template:
    metadata:
      labels:
        app: togglemaster-self-healing

    spec:
      serviceAccountName: togglemaster-self-healing

      containers:
        - name: self-healing

          image: 767397858387.dkr.ecr.us-east-1.amazonaws.com/togglemaster-self-healing:fase4
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: TARGET_NAMESPACE
              value: monitoring

            - name: TARGET_DEPLOYMENT
              value: grafana

            - name: COOLDOWN_SECONDS
              value: "600"

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 20