apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-configmap
  namespace: analytics
data:
  PORT: "8005"
  AWS_REGION: "us-east-1"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/767397858387/togglemaster-academy-queue"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318"
  DEPLOYMENT_ENVIRONMENT: "academy"
  OTEL_SERVICE_NAME: "analytics-service"
  OTEL_TRACES_EXPORTER: "otlp_proto_http"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=academy"
