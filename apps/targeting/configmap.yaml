apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-configmap
  namespace: targeting
data:
  PORT: "8003"
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8001"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318"
  DEPLOYMENT_ENVIRONMENT: "academy"
  OTEL_SERVICE_NAME: "targeting-service"
  OTEL_TRACES_EXPORTER: "otlp_proto_http"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=academy"
